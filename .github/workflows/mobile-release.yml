name: Mobile Release

on:
  workflow_dispatch:
  push:
    tags:
      - "mobile-v*"

permissions:
  contents: read

jobs:
  build-mobile-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build mobile bundle
        working-directory: frontend
        run: npm run build:mobile

      - name: Capacitor sync
        working-directory: frontend
        run: npx cap sync

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-dist
          path: |
            frontend/dist
            frontend/android
            frontend/ios

  android-release:
    needs: build-mobile-web
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/mobile-v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mobile-dist
          path: frontend

      - name: Build Android bundle
        working-directory: frontend/android
        run: ./gradlew bundleRelease || echo "Configure signing locally for Play Internal upload"

  ios-release:
    needs: build-mobile-web
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/mobile-v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mobile-dist
          path: frontend

      - name: Fastlane TestFlight upload
        working-directory: fastlane
        run: |
          if [ -f Gemfile ]; then bundle install; fi
          bundle exec fastlane ios beta || echo "Configure App Store Connect API key for TestFlight"
