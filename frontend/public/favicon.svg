<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      .bg-rect { fill: #0f172a; rx: 112px; }
      .house-roof { fill: #38bdf8; }
      .house-body { fill: #1e293b; stroke: #38bdf8; stroke-width: 14; stroke-linejoin: round; }
      .tool-primary { fill: #2563eb; }
      .tool-accent { fill: #60a5fa; }
      .tool-metal { fill: #f8fafc; }
      .badge-glow { fill: #0284c7; opacity: 0.25; }
      
      @media (prefers-color-scheme: dark) {
        .bg-rect { fill: #020617; }
        .house-roof { fill: #38bdf8; }
        .house-body { fill: #0f172a; stroke: #60a5fa; stroke-width: 14; }
        .tool-metal { fill: #ffffff; }
        .tool-accent { fill: #38bdf8; }
        .tool-primary { fill: #3b82f6; }
      }
    </style>
  </defs>

  <!-- Base Rounded Container -->
  <rect class="bg-rect" x="16" y="16" width="480" height="480" />

  <!-- Background Glow behind icon -->
  <circle class="badge-glow" cx="256" cy="256" r="180" />

  <!-- House Outline (Compliance/Building Shell) -->
  <path class="house-body" d="M 120 230 L 120 400 A 16 16 0 0 0 136 416 L 376 416 A 16 16 0 0 0 392 400 L 392 230 Z" />
  <path class="house-roof" d="M 80 236 L 243 96 A 20 20 0 0 1 269 96 L 432 236 A 12 12 0 0 1 424 256 L 392 256 L 256 140 L 120 256 L 88 256 A 12 12 0 0 1 80 236 Z" />

  <!-- Crossed Tools: Hammer & Wrench -->
  <!-- Wrench (Diagonal Left to Right) -->
  <g transform="translate(256, 300) rotate(-45) translate(-256, -300)">
    <rect class="tool-accent" x="242" y="180" width="28" height="220" rx="14" />
    <path class="tool-metal" d="M 230 180 C 210 160 210 130 235 115 C 255 100 280 115 285 135 C 270 145 260 160 270 180 Z" />
    <circle class="tool-metal" cx="256" cy="380" r="12" />
  </g>

  <!-- Claw Hammer (Diagonal Right to Left) -->
  <g transform="translate(256, 300) rotate(45) translate(-256, -300)">
    <rect class="tool-primary" x="242" y="170" width="28" height="230" rx="14" />
    <!-- Hammer Head -->
    <path class="tool-metal" d="M 200 140 A 10 10 0 0 1 210 130 L 300 130 A 10 10 0 0 1 310 140 L 310 180 A 10 10 0 0 1 300 190 L 210 190 A 10 10 0 0 1 200 180 Z" />
    <!-- Claw -->
    <path class="tool-metal" d="M 200 140 C 170 145 155 170 150 195 C 165 185 185 175 200 180 Z" />
  </g>

  <!-- Center Compliance Sparkle / Star -->
  <path class="tool-metal" d="M 256 220 L 262 238 L 280 244 L 262 250 L 256 268 L 250 250 L 232 244 L 250 238 Z" />
</svg>
